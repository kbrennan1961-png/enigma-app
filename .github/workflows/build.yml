name: Build all platforms

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  web:
    name: Web (GitHub Pages source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload standalone web app
        uses: actions/upload-artifact@v4
        with:
          name: web-standalone
          path: standalone.html

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare desktop project
        run: |
          cp standalone.html desktop/standalone.html
        shell: bash
      - name: Install dependencies
        working-directory: desktop
        run: npm install
      - name: Build
        working-directory: desktop
        run: npx electron-builder --publish never
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: desktop/dist/*

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp standalone.html android/app/src/main/assets/standalone.html
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.9
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/*.apk
