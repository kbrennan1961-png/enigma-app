<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enigma Machine — Interactive Encrypt/Decrypt</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --accent:#38bdf8; --text:#e2e8f0; --muted:#94a3b8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:900px; margin:0 auto; padding:24px; }
  h1 { color:var(--accent); margin-bottom:4px; }
  p.sub { color:var(--muted); margin-top:0; }
  .card { background:var(--card); border-radius:12px; padding:20px; margin-bottom:16px; box-shadow:0 4px 16px rgba(0,0,0,.3); }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
  input, textarea, select { width:100%; padding:10px 12px; border-radius:8px; border:1px solid #334155; background:#0b1220; color:var(--text); font-size:15px; }
  textarea { min-height:120px; resize:vertical; font-family:monospace; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
  button { padding:12px 20px; border:none; border-radius:8px; background:var(--accent); color:#0f172a; font-weight:700; cursor:pointer; font-size:15px; }
  button.secondary { background:#334155; color:var(--text); }
  .btns { display:flex; gap:12px; flex-wrap:wrap; }
  .out { background:#0b1220; border:1px solid #334155; border-radius:8px; padding:14px; min-height:60px; font-family:monospace; white-space:pre-wrap; word-break:break-word; }
  .hint { font-size:12px; color:var(--muted); margin-top:6px; }
  .status { font-size:13px; color:var(--muted); margin-top:8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Enigma Machine</h1>
  <p class="sub">Interactive encrypt / decrypt using the NSA enigma-simulator. Encryption is symmetric — same settings decrypt.</p>

  <div class="card">
    <label>Message</label>
    <textarea id="message" placeholder="Type a message (letters and spaces only)..."></textarea>
    <div class="hint">Only a–z / A–Z and spaces are allowed (spaces are stripped by the machine).</div>
  </div>

  <div class="card">
    <div class="row">
      <div>
        <label>Rotor window key (3 letters)</label>
        <input id="key" value="AAA" maxlength="3">
      </div>
      <div>
        <label>Plugboard swaps (e.g. AB, CD, EF)</label>
        <input id="swaps" placeholder="AB, CD">
      </div>
    </div>
    <div style="margin-top:12px;">
      <label>Rotor order (left / middle / right)</label>
      <div class="row3">
        <select id="r0"><option>I</option><option>II</option><option>III</option><option>V</option></select>
        <select id="r1"><option>I</option><option selected>II</option><option>III</option><option>V</option></select>
        <select id="r2"><option>I</option><option>II</option><option selected>III</option><option>V</option></select>
      </div>
    </div>
  </div>

  <div class="btns">
    <button id="enc">Encrypt</button>
    <button id="dec" class="secondary">Decrypt</button>
    <button id="swap" class="secondary">Swap message ↔ result</button>
  </div>

  <div class="card" style="margin-top:16px;">
    <label>Result</label>
    <div class="out" id="result"></div>
    <div class="status" id="status"></div>
  </div>
</div>

<script>
async function process() {
  const key = document.getElementById('key').value.trim();
  const swapsRaw = document.getElementById('swaps').value.trim();
  const swaps = swapsRaw ? swapsRaw.split(/[,\s]+/).filter(Boolean) : [];
  const rotor_order = [
    document.getElementById('r0').value,
    document.getElementById('r1').value,
    document.getElementById('r2').value,
  ];
  const message = document.getElementById('message').value;
  const status = document.getElementById('status');
  status.textContent = 'Processing...';
  try {
    const res = await fetch('/api/process', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message, key, swaps, rotor_order})
    });
    const data = await res.json();
    if (!res.ok) { status.textContent = 'Error: ' + (data.error||res.statusText); return; }
    document.getElementById('result').textContent = data.result;
    status.textContent = 'Done.';
  } catch (e) {
    status.textContent = 'Error: ' + e;
  }
}
document.getElementById('enc').addEventListener('click', process);
document.getElementById('dec').addEventListener('click', process);
document.getElementById('swap').addEventListener('click', () => {
  const m = document.getElementById('message');
  const r = document.getElementById('result');
  const tmp = m.value;
  m.value = r.textContent;
  r.textContent = tmp;
});
</script>
</body>
</html>
